name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Pest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: erp_saas_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Cliente de PostgreSQL 17
        working-directory: .
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, mbstring, intl, gd, zip, bcmath
          coverage: none

      - name: Dependencias
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan config:clear

      - name: Análisis estático (PHPStan)
        run: composer analyse

      - name: Correr pruebas
        run: php vendor/bin/pest

  web:
    name: Web (tipos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Tipos del contrato de la API al día
        run: npm run contract:check

      - name: Revisar tipos
        run: npx tsc --noEmit -p .
