<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGENDA360</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>/* AGENDA360 · prototipo
   Concepto: interfaz clara y amable — menú lateral blanco, azul vivo para las acciones principales, violeta para lo destacado y colores de estado fáciles de leer. */
:root {
  --bg: #F4F6FB; --surface: #FFFFFF; --surface-2: #F1F4FA; --surface-3: #E8EDF6; --ink: #101828; --ink-2: #344054; --muted: #667085; --line: #E4E8F1; --line-2: #D0D7E4;
  --brand: #2F5BEA; --brand-2: #4A72F5; --brand-soft: #E7EEFF; --brand-ink: #FFFFFF;
  --accent: #7A3FF2; --accent-soft: #F1EAFF;
  --ok: #0E9F6E; --ok-soft: #DDF6EC; --warn: #C27803; --warn-soft: #FEF3D7; --bad: #E0393E; --bad-soft: #FDE4E4; --info: #0A84C6; --info-soft: #DFF2FC; --violet: #7A3FF2; --violet-soft: #F1EAFF;
  --rail: #FFFFFF; --rail-2: #F1F4FA; --rail-ink: #344054; --rail-muted: #8A94A8; --rail-active: #2F5BEA; --rail-strong: #101828; --rail-line: #E4E8F1; --rail-active-bg: #E7EEFF;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 6px 18px rgba(16, 24, 40, .06);
  --shadow-lg: 0 16px 48px rgba(16, 24, 40, .20);
  --f-display: "Plus Jakarta Sans", "Figtree", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-sm: 8px; --r: 12px; --r-lg: 16px;
  --hatch: repeating-linear-gradient(135deg, rgba(102, 112, 133, .12) 0 6px, transparent 6px 12px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1020; --surface: #121A2E; --surface-2: #18223A; --surface-3: #202B46; --ink: #E7ECF7; --ink-2: #C3CCDD; --muted: #8E9AB3; --line: #232E48; --line-2: #2F3B58;
    --brand: #6E8DFF; --brand-2: #8AA3FF; --brand-soft: #1C2A55; --brand-ink: #0B1020;
    --accent: #A67CFF; --accent-soft: #2A1F4D;
    --ok: #34D399; --ok-soft: #10342A; --warn: #FBBF24; --warn-soft: #3A2E10; --bad: #F87171; --bad-soft: #3D1A1E; --info: #38BDF8; --info-soft: #0F2C40; --violet: #A67CFF; --violet-soft: #2A1F4D;
    --rail: #0E1528; --rail-2: #18223A; --rail-ink: #C3CCDD; --rail-muted: #7E8AA3; --rail-active: #8AA3FF; --rail-strong: #FFFFFF; --rail-line: #1E2840; --rail-active-bg: #1C2A55;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3); --shadow-lg: 0 16px 48px rgba(0, 0, 0, .55);
    --hatch: repeating-linear-gradient(135deg, rgba(142, 154, 179, .14) 0 6px, transparent 6px 12px);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1020; --surface: #121A2E; --surface-2: #18223A; --surface-3: #202B46; --ink: #E7ECF7; --ink-2: #C3CCDD; --muted: #8E9AB3; --line: #232E48; --line-2: #2F3B58;
    --brand: #6E8DFF; --brand-2: #8AA3FF; --brand-soft: #1C2A55; --brand-ink: #0B1020;
    --accent: #A67CFF; --accent-soft: #2A1F4D;
    --ok: #34D399; --ok-soft: #10342A; --warn: #FBBF24; --warn-soft: #3A2E10; --bad: #F87171; --bad-soft: #3D1A1E; --info: #38BDF8; --info-soft: #0F2C40; --violet: #A67CFF; --violet-soft: #2A1F4D;
    --rail: #0E1528; --rail-2: #18223A; --rail-ink: #C3CCDD; --rail-muted: #7E8AA3; --rail-active: #8AA3FF; --rail-strong: #FFFFFF; --rail-line: #1E2840; --rail-active-bg: #1C2A55;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3); --shadow-lg: 0 16px 48px rgba(0, 0, 0, .55);
    --hatch: repeating-linear-gradient(135deg, rgba(142, 154, 179, .14) 0 6px, transparent 6px 12px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; line-height: 1.2; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.55rem; font-weight: 650; }
h2 { font-size: 1.15rem; font-weight: 650; }
h3 { font-size: 1rem; font-weight: 600; }
h4 { font-size: .9rem; font-weight: 600; }
.mono, code { font-family: var(--f-mono); font-size: .86em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.xs { font-size: .74rem; }
.right { text-align: right; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
.strong { font-weight: 600; }
.eyebrow { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.app.rail-collapsed { grid-template-columns: 64px minmax(0, 1fr); }
.rail { background: var(--rail); color: var(--rail-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; scrollbar-width: thin; z-index: 30; }
.rail-head { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--rail-active); color: #1d1405; display: grid; place-items: center; font: 700 15px/1 var(--f-display); flex: none; }
.brandname { font: 650 1.02rem/1.1 var(--f-display); color: #fff; letter-spacing: -.01em; }
.brandname small { display: block; font: 500 .72rem/1.3 var(--f-body); color: var(--rail-muted); letter-spacing: 0; }
.tenant-card { margin: 4px 12px 10px; padding: 10px 12px; border-radius: var(--r); background: var(--rail-2); font-size: .8rem; }
.tenant-card b { color: #fff; display: block; font-size: .84rem; }
.rail nav { padding: 4px 8px 16px; flex: 1; }
.nav-group { margin-top: 10px; }
.nav-group > button { all: unset; cursor: pointer; display: flex; width: calc(100% - 16px); padding: 6px 8px; font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; color: var(--rail-muted); font-weight: 600; align-items: center; justify-content: space-between; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; margin: 1px 0; border-radius: 8px; color: var(--rail-ink); font-size: .88rem; text-decoration: none !important; position: relative; }
.nav-item:hover { background: var(--rail-2); color: #fff; }
.nav-item.active { background: var(--rail-2); color: #fff; font-weight: 600; }
.nav-item.active::before { content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--rail-active); }
.nav-item svg { width: 18px; height: 18px; flex: none; opacity: .9; }
.nav-item .count { margin-left: auto; background: var(--rail-active); color: #241703; font-size: .68rem; font-weight: 700; border-radius: 10px; padding: 0 6px; line-height: 17px; }
.rail-collapsed .nav-item span, .rail-collapsed .nav-group > button, .rail-collapsed .tenant-card, .rail-collapsed .brandname, .rail-collapsed .nav-item .count { display: none; }
.rail-foot { padding: 12px 16px; border-top: 1px solid var(--rail-2); font-size: .75rem; color: var(--rail-muted); }
.rail-foot button { all: unset; cursor: pointer; color: var(--rail-ink); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 10px 24px; min-height: 58px; }
.crumbs { font-size: .82rem; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs b { color: var(--ink); font-weight: 600; }
.topbar .grow { flex: 1; }
.searchbox { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; color: var(--muted); min-width: 220px; cursor: text; font-size: .84rem; }
.searchbox kbd { margin-left: auto; font: 500 .7rem var(--f-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.icon-btn { all: unset; cursor: pointer; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; color: var(--ink-2); position: relative; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn .dot { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad); color: #fff; font-size: .62rem; font-weight: 700; display: grid; place-items: center; padding: 0 3px; }
.userchip { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 4px; border-radius: 10px; }
.userchip:hover { background: var(--surface-2); }
.userchip .who { line-height: 1.15; font-size: .8rem; }
.userchip .who small { display: block; color: var(--muted); font-size: .7rem; }
.content { padding: 22px 24px 48px; min-width: 0; }

/* ---------- Page ---------- */
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head .titles { flex: 1; min-width: 240px; }
.page-head p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ref { display: inline-flex; gap: 4px; align-items: center; font: 500 .68rem var(--f-mono); color: var(--muted); border: 1px dashed var(--line-2); border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: middle; white-space: nowrap; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-side { grid-template-columns: minmax(0, 1fr) 340px; }
.g-side-l { grid-template-columns: 300px minmax(0, 1fr); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.stack-lg { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; flex-wrap: wrap; }
.card-h h3 { flex: 1; }
.card-b { padding: 4px 16px 16px; }
.card-b.flush { padding: 0; }
.card.pad { padding: 16px; }
.section-title { display: flex; align-items: baseline; gap: 10px; margin: 22px 0 10px; }
.section-title h2 { flex: 1; }
.divider-v { width: 1px; align-self: stretch; background: var(--line); }

/* ---------- Buttons ---------- */
.btn { font: 600 .85rem/1 var(--f-body); display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; text-decoration: none !important; }
.btn:hover { background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { background: var(--brand-2); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 6px 10px; font-size: .78rem; border-radius: 7px; }
.btn.xs { padding: 3px 7px; font-size: .72rem; border-radius: 6px; }
.btn[disabled], .btn.locked { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn-group { display: inline-flex; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; }
.btn-group button { all: unset; cursor: pointer; padding: 7px 12px; font-size: .8rem; font-weight: 600; color: var(--muted); }
.btn-group button.on { background: var(--brand-soft); color: var(--brand); }
.btn-group button + button { border-left: 1px solid var(--line-2); }
.linkbtn { all: unset; cursor: pointer; color: var(--brand); font-weight: 600; font-size: inherit; }
.linkbtn:hover { text-decoration: underline; }

/* ---------- Badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 650; padding: 2px 8px; border-radius: 20px; line-height: 1.5; white-space: nowrap; background: var(--surface-3); color: var(--ink-2); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.badge.plain::before { display: none; }
.t-ok { background: var(--ok-soft); color: var(--ok); }
.t-warn { background: var(--warn-soft); color: var(--warn); }
.t-bad { background: var(--bad-soft); color: var(--bad); }
.t-info { background: var(--info-soft); color: var(--info); }
.t-accent { background: var(--violet-soft); color: var(--violet); }
.t-muted { background: var(--surface-3); color: var(--muted); }
.t-neutral { background: var(--surface-3); color: var(--ink-2); }
.t-brand { background: var(--brand-soft); color: var(--brand); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 600; padding: 1px 7px; border-radius: 5px; border: 1px solid; white-space: nowrap; }
.origin { font: 600 .62rem var(--f-mono); padding: 1px 5px; border-radius: 4px; letter-spacing: .03em; }
.origin.DOC { background: var(--info-soft); color: var(--info); }
.origin.MEJ { background: var(--accent-soft); color: var(--accent); }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .lbl { font-size: .76rem; color: var(--muted); font-weight: 600; }
.kpi .val { font: 650 clamp(1.15rem, 1.5vw, 1.5rem)/1.15 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi .sub { font-size: .76rem; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.kpi .up { color: var(--ok); font-weight: 600; }
.kpi .down { color: var(--bad); font-weight: 600; }
.kpi svg.spark { width: 100%; height: 28px; margin-top: 4px; }
.kpi.alert { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .85rem; }
.tbl th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; white-space: nowrap; }
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover { color: var(--ink); }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tr.clickable { cursor: pointer; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tfoot td { font-weight: 650; background: var(--surface-2); }
.tbl .sub { display: block; color: var(--muted); font-size: .76rem; }
.tbl-toolbar { display: flex; gap: 8px; padding: 10px 12px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); }
.tbl-toolbar .search { flex: 1; min-width: 180px; max-width: 320px; }
.tbl-foot { display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.tbl-foot .grow { flex: 1; }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); }
.empty h4 { color: var(--ink); margin-bottom: 4px; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label { font-size: .78rem; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: .74rem; color: var(--muted); }
.field .req { color: var(--bad); }
input.in, select.in, textarea.in { font: inherit; font-size: .88rem; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--surface); color: var(--ink); width: 100%; min-width: 0; }
input.in:focus, select.in:focus, textarea.in:focus { outline: 2px solid color-mix(in srgb, var(--brand) 40%, transparent); border-color: var(--brand); }
textarea.in { resize: vertical; min-height: 70px; }
.in.sm { padding: 5px 8px; font-size: .8rem; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: .86rem; cursor: pointer; }
.check input { margin-top: 3px; accent-color: var(--brand); }
.switch { position: relative; width: 38px; height: 22px; flex: none; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--line-2); border-radius: 22px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.switch input:checked + span { background: var(--brand); }
.switch input:checked + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border: 1px solid var(--line-2); border-radius: 8px; font-size: .82rem; font-weight: 600; color: var(--ink-2); background: var(--surface); }
.seg input:checked + span { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }

/* ---------- Overlays ---------- */
.overlay { position: fixed; inset: 0; background: rgba(8, 20, 17, .45); z-index: 100; display: grid; place-items: center; padding: 16px; animation: fade .12s ease; }
.modal { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; border: 1px solid var(--line); }
.modal.lg { width: min(820px, 100%); }
.modal.xl { width: min(1100px, 100%); }
.modal.sm { width: min(420px, 100%); }
.modal-h { padding: 16px 18px 8px; display: flex; gap: 10px; align-items: flex-start; }
.modal-h h2 { flex: 1; }
.modal-b { padding: 6px 18px 16px; overflow-y: auto; }
.modal-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.drawer-ov { position: fixed; inset: 0; background: rgba(8, 20, 17, .35); z-index: 90; animation: fade .12s ease; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--surface); z-index: 91; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; animation: slidein .18s ease; border-left: 1px solid var(--line); }
.drawer.wide { width: min(780px, 100vw); }
.drawer-h { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.drawer-h .t { flex: 1; min-width: 0; }
.drawer-b { padding: 16px 18px; overflow-y: auto; flex: 1; }
.drawer-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } }
@keyframes slidein { from { transform: translateX(30px); opacity: .4; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.toasts { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: .85rem; display: flex; gap: 10px; align-items: flex-start; animation: fade .15s ease; }
.toast.bad { background: var(--bad); color: #fff; }
.toast.ok { background: var(--ok); color: #fff; }
.toast .code { font: 600 .7rem var(--f-mono); opacity: .85; display: block; }
.menu { position: absolute; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; z-index: 60; min-width: 220px; }
.menu button, .menu a { all: unset; display: flex; gap: 8px; align-items: center; width: calc(100% - 20px); padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: .86rem; color: var(--ink); }
.menu button:hover, .menu a:hover { background: var(--surface-2); }
.menu .sep { height: 1px; background: var(--line); margin: 4px 0; }

/* ---------- Misc components ---------- */
.avatar { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; font: 650 .75rem var(--f-body); color: #fff; flex: none; background: var(--brand); }
.avatar.lg { width: 52px; height: 52px; font-size: 1.05rem; }
.avatar.sm { width: 24px; height: 24px; font-size: .62rem; }
.flow { display: flex; align-items: center; gap: 0; flex-wrap: wrap; margin: 4px 0 10px; }
.flow .st { font-size: .74rem; font-weight: 600; padding: 4px 10px; border: 1px solid var(--line-2); color: var(--muted); background: var(--surface); position: relative; }
.flow .st:first-child { border-radius: 20px 0 0 20px; }
.flow .st:last-child { border-radius: 0 20px 20px 0; }
.flow .st + .st { border-left: 0; }
.flow .st.done { background: var(--brand-soft); color: var(--brand); }
.flow .st.cur { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.flow .st.off { background: var(--bad-soft); color: var(--bad); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 0 14px 20px; font-size: .84rem; }
.timeline li::before { content: ""; position: absolute; left: 4px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.timeline li::after { content: ""; position: absolute; left: 7.5px; top: 16px; bottom: 0; width: 1px; background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline li.ok::before { background: var(--ok); } .timeline li.bad::before { background: var(--bad); } .timeline li.info::before { background: var(--info); } .timeline li.warn::before { background: var(--warn); } .timeline li.accent::before { background: var(--violet); }
.timeline .when { color: var(--muted); font-size: .74rem; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; font-size: .86rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.list { list-style: none; margin: 0; padding: 0; }
.list > li { padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.list > li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 0; }
.note { padding: 10px 12px; border-radius: var(--r); background: var(--surface-2); font-size: .84rem; border: 1px solid var(--line); }
.note.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); color: var(--ink); }
.note.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 30%, transparent); }
.note.info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 25%, transparent); }
.note.ok { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 25%, transparent); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
.tabs button { all: unset; cursor: pointer; padding: 9px 12px; font-size: .86rem; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--brand); }
.tabs button .c { font-size: .7rem; background: var(--surface-3); border-radius: 10px; padding: 0 6px; margin-left: 4px; }
.progress { height: 6px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--brand); border-radius: 6px; }
.progress.warn > i { background: var(--accent); }
.chart { width: 100%; display: block; }
.chart text { fill: var(--muted); font: 500 12px var(--f-body); }
.chart .grid-l { stroke: var(--line); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .76rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.statline { display: flex; gap: 18px; flex-wrap: wrap; font-size: .82rem; }
.statline b { font-family: var(--f-display); font-size: 1.05rem; display: block; }
.chipbar { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { all: unset; cursor: pointer; font-size: .78rem; font-weight: 600; padding: 5px 10px; border-radius: 20px; border: 1px solid var(--line-2); color: var(--ink-2); background: var(--surface); white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .c { opacity: .7; margin-left: 3px; }
.lock { display: inline-flex; width: 13px; height: 13px; }

/* ---------- Agenda ---------- */
.ag-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.ag-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.ag-date { font: 650 1.05rem var(--f-display); min-width: 0; }
.ag-scroll { overflow: auto; max-height: calc(100vh - 230px); position: relative; }
.ag-grid { display: grid; position: relative; min-width: 100%; }
.ag-colhead { position: sticky; top: 0; z-index: 6; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px 8px; display: flex; gap: 8px; align-items: center; font-size: .8rem; min-height: 50px; border-left: 1px solid var(--line); }
.ag-colhead .meta { line-height: 1.2; min-width: 0; }
.ag-colhead .meta b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag-colhead .meta small { color: var(--muted); }
.ag-corner { position: sticky; top: 0; left: 0; z-index: 8; background: var(--surface); border-bottom: 1px solid var(--line); }
.ag-times { position: sticky; left: 0; z-index: 5; background: var(--surface); }
.ag-time { height: var(--slot-h); font: 500 .68rem var(--f-mono); color: var(--muted); text-align: right; padding: 0 6px; transform: translateY(-7px); }
.ag-col { position: relative; border-left: 1px solid var(--line); }
.ag-cell { height: var(--slot-h); border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); cursor: pointer; }
.ag-cell.hour { border-bottom-color: var(--line); }
.ag-cell.off { background: var(--hatch); cursor: not-allowed; }
.ag-cell:not(.off):hover { background: var(--brand-soft); }
.ag-block { position: absolute; left: 2px; right: 2px; background: var(--hatch), var(--surface-2); border: 1px dashed var(--line-2); border-radius: 6px; font-size: .7rem; color: var(--muted); padding: 3px 6px; z-index: 2; overflow: hidden; pointer-events: auto; cursor: pointer; }
.ag-appt { position: absolute; left: 3px; right: 3px; border-radius: 7px; padding: 4px 7px; font-size: .74rem; line-height: 1.25; overflow: hidden; z-index: 3; cursor: pointer; border-left: 4px solid var(--c, var(--brand)); background: color-mix(in srgb, var(--c, var(--brand)) 15%, var(--surface)); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.ag-appt:hover { box-shadow: var(--shadow); z-index: 4; }
.ag-appt b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag-appt .s { display: block; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ag-appt .st { position: absolute; right: 5px; top: 4px; width: 8px; height: 8px; border-radius: 50%; }
.ag-appt.st-pending { border-left-style: dashed; }
.ag-appt.st-cancelled { opacity: .45; text-decoration: line-through; }
.ag-appt.st-no_show { background: var(--bad-soft); border-left-color: var(--bad); }
.ag-appt.st-completed { opacity: .72; }
.ag-appt.st-in_progress { box-shadow: 0 0 0 2px var(--c, var(--brand)); }
.ag-appt.group { border-left-color: var(--info); background: var(--info-soft); }
.ag-appt.dragging { opacity: .5; }
.ag-buffer { position: absolute; left: 6px; right: 6px; background: var(--hatch); border-radius: 4px; z-index: 1; opacity: .8; pointer-events: none; }
.ag-now { position: absolute; left: 0; right: 0; height: 2px; background: var(--bad); z-index: 7; pointer-events: none; }
.ag-now::before { content: ""; position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.ag-drop { background: color-mix(in srgb, var(--accent) 20%, transparent) !important; }
.ag-legend { display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid var(--line); font-size: .74rem; color: var(--muted); }
.slotgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.slot { all: unset; cursor: pointer; text-align: center; padding: 7px 4px; border-radius: 8px; border: 1px solid var(--line-2); font: 600 .82rem var(--f-mono); background: var(--surface); }
.slot:hover { border-color: var(--brand); color: var(--brand); }
.slot.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.slot.busy { background: var(--hatch); color: var(--muted); cursor: help; text-decoration: line-through; border-style: dashed; }
.weekgrid { display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 8px; }
.daycell { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-height: 140px; padding: 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.daycell.today { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.daycell .dh { display: flex; justify-content: space-between; font-size: .76rem; color: var(--muted); font-weight: 600; }
.mini-appt { font-size: .72rem; padding: 3px 6px; border-radius: 5px; border-left: 3px solid var(--c, var(--brand)); background: color-mix(in srgb, var(--c, var(--brand)) 10%, var(--surface)); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- POS ---------- */
.pos { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 16px; align-items: start; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tile { all: unset; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-height: 64px; border-top: 3px solid var(--c, var(--line-2)); }
.tile:hover { border-color: var(--brand); }
.tile b { font-size: .84rem; line-height: 1.25; }
.tile span { font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cart { position: sticky; top: 76px; }
.cart-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .84rem; }
.totals { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: .86rem; font-variant-numeric: tabular-nums; }
.totals .grand { font: 700 1.35rem var(--f-display); }

/* ---------- Login / portal / booking ---------- */
.auth { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.auth-side { background: var(--rail); color: var(--rail-ink); padding: 40px 48px; display: flex; flex-direction: column; gap: 22px; position: relative; overflow: hidden; }
.auth-side h1 { color: #fff; font-size: clamp(1.7rem, 3vw, 2.4rem); font-weight: 700; letter-spacing: -.025em; max-width: 16ch; }
.auth-side p { max-width: 48ch; color: var(--rail-ink); }
.auth-flow { font: 500 .78rem/2 var(--f-mono); color: var(--rail-muted); }
.auth-flow b { color: var(--rail-active); font-weight: 600; }
.auth-main { padding: 32px clamp(16px, 4vw, 56px); display: flex; flex-direction: column; justify-content: center; gap: 16px; max-width: 640px; }
.tenant-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tenant-pick button { all: unset; cursor: pointer; border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
.tenant-pick button.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--brand-soft); }
.tenant-pick small { color: var(--muted); font-size: .74rem; }
.public { min-height: 100%; background: var(--bg); }
.public-head { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; gap: 12px; align-items: center; }
.public-body { max-width: 980px; margin: 0 auto; padding: 22px 16px 60px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.steps span { font-size: .76rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; background: var(--surface-3); color: var(--muted); }
.steps span.on { background: var(--brand); color: var(--brand-ink); }
.steps span.done { background: var(--brand-soft); color: var(--brand); }
.pick-card { all: unset; cursor: pointer; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.pick-card:hover { border-color: var(--brand); }
.pick-card.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.daystrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.daystrip button { all: unset; cursor: pointer; flex: none; width: 58px; text-align: center; padding: 8px 0; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); font-size: .74rem; }
.daystrip button b { display: block; font: 650 1.05rem var(--f-display); }
.daystrip button.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.daystrip button.none { opacity: .45; }
.phone { max-width: 420px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 26px; overflow: hidden; box-shadow: var(--shadow); }

/* ---------- Inspector ---------- */
.inspector { position: fixed; right: 0; bottom: 0; width: min(560px, 100vw); height: min(56vh, 520px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px 0 0 0; box-shadow: var(--shadow-lg); z-index: 80; display: flex; flex-direction: column; }
.inspector-h { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.inspector-b { overflow-y: auto; flex: 1; font-size: .78rem; }
.api-row { padding: 8px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.api-row .m { font: 700 .7rem var(--f-mono); padding: 1px 5px; border-radius: 4px; background: var(--surface-3); }
.api-row .p { font-family: var(--f-mono); }
.api-row .s2 { font: 600 .72rem var(--f-mono); }
.api-steps { margin: 6px 0 0; padding: 0; list-style: none; font-family: var(--f-mono); font-size: .72rem; color: var(--muted); }

/* ---------- Doc page ---------- */
.doc { max-width: 980px; }
.doc h2 { margin: 26px 0 10px; }
.doc h3 { margin: 18px 0 8px; }
.doc p, .doc li { max-width: 78ch; }
.doc table { font-size: .82rem; }

/* ---------- Responsive ---------- */
.hide-sm { }
.only-sm { display: none !important; }
@media (max-width: 1180px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-side { grid-template-columns: minmax(0, 1fr); } .pos { grid-template-columns: minmax(0, 1fr); } .cart { position: static; } }
@media (max-width: 900px) {
  .app, .app.rail-collapsed { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; left: 0; top: 0; bottom: 0; width: 264px; transform: translateX(-100%); transition: transform .2s; }
  .app.rail-open .rail { transform: none; }
  .app.rail-collapsed .nav-item span, .app.rail-collapsed .nav-group > button, .app.rail-collapsed .tenant-card, .app.rail-collapsed .brandname { display: revert; }
  .only-sm { display: inline-grid !important; }
  .hide-sm { display: none !important; }
  .g3, .g2, .g-side-l { grid-template-columns: minmax(0, 1fr); }
  .auth { grid-template-columns: minmax(0, 1fr); }
  .auth-side { padding: 24px 16px; }
  .content { padding: 16px 16px 40px; }
  .topbar { padding: 8px 16px; }
  .searchbox { min-width: 0; }
  .weekgrid { grid-template-columns: repeat(7, minmax(110px, 1fr)); overflow-x: auto; }
}
@media (max-width: 560px) {
  .g4 { grid-template-columns: minmax(0, 1fr); }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .tenant-pick { grid-template-columns: minmax(0, 1fr); }
  .userchip .who { display: none; }
  .searchbox span, .searchbox kbd { display: none; }
  .searchbox { min-width: 0; padding: 8px; }
  .page-head h1 { font-size: 1.3rem; }
  .tbl.cards thead { display: none; }
  .tbl.cards tr { display: block; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .tbl.cards td { display: flex; justify-content: space-between; gap: 10px; border: 0; padding: 3px 0; text-align: right; }
  .tbl.cards td::before { content: attr(data-label); color: var(--muted); font-size: .74rem; font-weight: 600; text-align: left; }
  .tbl.cards td.num { text-align: right; }
}

/* ---------- Rubros: odontograma, escala, plantillas, cola y kiosko (CHG-038…047) ---------- */
.teeth { display: inline-flex; flex-direction: column; gap: 4px; max-width: 100%; overflow-x: auto; }
.teeth-row { display: grid; grid-template-columns: repeat(16, minmax(26px, 1fr)); gap: 3px; }
.teeth-row > :nth-child(8) { margin-right: 6px; }
.tooth { all: unset; box-sizing: border-box; text-align: center; font: 600 .7rem var(--f-mono); padding: 6px 0; border: 1px solid var(--line-2); border-radius: 6px 6px 9px 9px; background: var(--surface); color: var(--ink-2); cursor: pointer; }
.teeth-row:last-of-type .tooth, .teeth > .teeth-row + .teeth-row .tooth { border-radius: 9px 9px 6px 6px; }
.tooth:hover:not(:disabled) { border-color: var(--brand); }
.tooth.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.tooth:disabled { cursor: default; }
.tooth:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.scale { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 4px; max-width: 520px; }
.scale label { cursor: pointer; }
.scale input { position: absolute; opacity: 0; pointer-events: none; }
.scale span { display: block; text-align: center; padding: 7px 0; border-radius: 6px; border: 1px solid var(--line-2); font: 600 .8rem var(--f-mono); background: var(--surface); }
.scale input:checked + span { color: #fff; border-color: transparent; }
.scale .sc0 input:checked + span, .scale .sc1 input:checked + span, .scale .sc2 input:checked + span, .scale .sc3 input:checked + span { background: var(--ok); }
.scale .sc4 input:checked + span, .scale .sc5 input:checked + span, .scale .sc6 input:checked + span { background: var(--warn); }
.scale .sc7 input:checked + span, .scale .sc8 input:checked + span, .scale .sc9 input:checked + span, .scale .sc10 input:checked + span { background: var(--bad); }
.scale input:focus-visible + span { outline: 2px solid var(--accent); }
.vt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.vt { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--surface); font-size: .82rem; }
.vt svg { width: 18px; height: 18px; color: var(--vc); }
.vt.on { border-color: var(--vc); box-shadow: inset 0 0 0 1px var(--vc); background: color-mix(in srgb, var(--vc) 8%, var(--surface)); }
.vt:focus-visible { outline: 2px solid var(--accent); }
.vt-card { border-top: 3px solid var(--vc); }
.ticket-no { font: 700 .95rem var(--f-mono); background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; letter-spacing: .02em; }
.ticket-no.sm { font-size: .75rem; padding: 3px 6px; }
.ticket-big { font: 700 3.4rem var(--f-mono); letter-spacing: .04em; margin: 6px 0; color: var(--brand); }
.queue-row { align-items: center; }
.kiosk .seg span { padding: 10px 14px; font-size: .9rem; }
.btn.lg { padding: 12px 18px; font-size: 1rem; justify-content: center; }
.rec-card:hover, .dep-card:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
@media (max-width: 720px) { .teeth-row { grid-template-columns: repeat(8, minmax(26px, 1fr)); } .teeth-row > :nth-child(8) { margin-right: 0; } .scale { grid-template-columns: repeat(6, minmax(0, 1fr)); } }

/* ---------- Rediseño 1.1: claro, intuitivo y con color (CHG-050) ---------- */
body { font-size: 14.5px; }
h1 { font-weight: 750; letter-spacing: -.02em; }
h2, h3 { font-weight: 700; }
.rail { border-right: 1px solid var(--rail-line); }
.logo { background: linear-gradient(135deg, var(--brand), var(--accent)); color: #fff; border-radius: 11px; box-shadow: 0 4px 12px color-mix(in srgb, var(--brand) 35%, transparent); }
.brandname { color: var(--rail-strong); }
.tenant-card { background: linear-gradient(135deg, var(--brand-soft), var(--accent-soft)); color: var(--rail-ink); border: 1px solid var(--rail-line); }
.tenant-card b { color: var(--rail-strong); }

.nav-item.active { background: var(--rail-active-bg); color: var(--brand); font-weight: 650; }

.rail-foot { border-top: 1px solid var(--rail-line); }

.topbar { background: color-mix(in srgb, var(--surface) 92%, transparent); }
.searchbox { background: var(--surface-2); border-color: transparent; border-radius: 10px; }

.btn { border-radius: 10px; padding: 9px 15px; transition: background .15s, box-shadow .15s, transform .05s; }

.btn.primary { box-shadow: 0 2px 8px color-mix(in srgb, var(--brand) 30%, transparent); }
.btn.accent { background: var(--accent); border-color: var(--accent); box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn.sm { border-radius: 8px; }
.card { border-radius: var(--r-lg); box-shadow: var(--shadow); border-color: var(--line); }
.kpi { border-radius: var(--r-lg); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--brand); opacity: .9; }

.kpi.alert { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); background: color-mix(in srgb, var(--bad-soft) 40%, var(--surface)); }
.chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.tabs button.on { color: var(--brand); }
.badge.t-accent { background: var(--accent-soft); color: var(--accent); }
.auth-side { background: radial-gradient(1200px 600px at -10% -10%, #5B7CFA 0%, transparent 55%), radial-gradient(900px 500px at 110% 110%, #8B5CF6 0%, transparent 55%), linear-gradient(160deg, #1F3FBF, #3B2A8F); color: #E6EBFF; }

.quick-new { position: relative; }
.ql-menu { min-width: 240px; }
.ql-menu button, .ql-menu a { display: flex; gap: 10px; align-items: center; }
.ql-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.ql-ic svg { width: 16px; height: 16px; }
.welcome { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 18px 20px; border-radius: var(--r-lg); background: linear-gradient(120deg, var(--brand) 0%, #5B4DF0 55%, var(--accent) 100%); color: #fff; margin-bottom: 16px; box-shadow: var(--shadow); }

/* ---------- Menús: íconos de tamaño fijo ---------- */

/* ---------- Estilo por rubro (CHG-052): cada empresa toma la paleta de su rubro ---------- */
:root[data-vertical="salon"] { --vb: #D6336C; --va: #7C3AED; }
:root[data-vertical="barber"] { --vb: #B45309; --va: #0F766E; }
:root[data-vertical="aesthetics"] { --vb: #C026D3; --va: #DB2777; }
:root[data-vertical="dental"] { --vb: #0284C7; --va: #0D9488; }
:root[data-vertical="medical"] { --vb: #0F766E; --va: #2563EB; }
:root[data-vertical="physio"] { --vb: #4F46E5; --va: #059669; }
:root[data-vertical="psychology"] { --vb: #3F8F5F; --va: #8B5CF6; }
:root[data-vertical="fitness"] { --vb: #EA580C; --va: #16A34A; }
:root[data-vertical="vet"] { --vb: #C2620A; --va: #0D9488; }
:root[data-vertical]:not([data-vertical="generic"]) {
  --brand: var(--vb); --brand-2: color-mix(in srgb, var(--vb) 82%, white); --brand-soft: color-mix(in srgb, var(--vb) 12%, white);
  --accent: var(--va); --accent-soft: color-mix(in srgb, var(--va) 12%, white); --violet: var(--va); --violet-soft: var(--accent-soft);
  --rail-active: var(--vb); --rail-active-bg: var(--brand-soft);
  --bg: color-mix(in srgb, var(--vb) 3%, #F5F6FA);
}
@media (prefers-color-scheme: dark) {
  :root[data-vertical]:not([data-vertical="generic"]):not([data-theme="light"]) {
    --brand: color-mix(in srgb, var(--vb) 70%, white); --brand-2: color-mix(in srgb, var(--vb) 55%, white); --brand-soft: color-mix(in srgb, var(--vb) 24%, #121A2E); --brand-ink: #0B1020;
    --accent: color-mix(in srgb, var(--va) 70%, white); --accent-soft: color-mix(in srgb, var(--va) 24%, #121A2E); --rail-active: var(--brand); --rail-active-bg: var(--brand-soft); --bg: #0B1020;
  }
}
:root[data-theme="dark"][data-vertical]:not([data-vertical="generic"]) {
  --brand: color-mix(in srgb, var(--vb) 70%, white); --brand-2: color-mix(in srgb, var(--vb) 55%, white); --brand-soft: color-mix(in srgb, var(--vb) 24%, #121A2E); --brand-ink: #0B1020;
  --accent: color-mix(in srgb, var(--va) 70%, white); --accent-soft: color-mix(in srgb, var(--va) 24%, #121A2E); --rail-active: var(--brand); --rail-active-bg: var(--brand-soft); --bg: #0B1020;
}
.welcome { background: linear-gradient(120deg, var(--brand) 0%, color-mix(in srgb, var(--brand) 55%, var(--accent)) 60%, var(--accent) 100%); }
.welcome .btn.primary { color: var(--brand); }
.tenant-card { position: relative; padding-left: 50px; }
.tc-ic { position: absolute; left: 10px; top: 10px; width: 30px; height: 30px; border-radius: 9px; background: var(--brand); color: #fff; display: grid; place-items: center; }
.tc-ic svg { width: 17px; height: 17px; }
.tenant-pick button { position: relative; padding-left: 52px; border-left: 4px solid var(--tpc, var(--brand)); }
.tp-ic { position: absolute; left: 12px; top: 12px; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--tpc, var(--brand)) 14%, white); color: var(--tpc, var(--brand)); }
.tp-ic svg { width: 17px; height: 17px; }
.tenant-pick .vt-salon { --tpc: #D6336C; } .tenant-pick .vt-barber { --tpc: #B45309; } .tenant-pick .vt-aesthetics { --tpc: #C026D3; } .tenant-pick .vt-dental { --tpc: #0284C7; } .tenant-pick .vt-medical { --tpc: #0F766E; } .tenant-pick .vt-physio { --tpc: #4F46E5; } .tenant-pick .vt-psychology { --tpc: #3F8F5F; } .tenant-pick .vt-fitness { --tpc: #EA580C; } .tenant-pick .vt-vet { --tpc: #C2620A; }
.tenant-pick button.on { border-color: var(--tpc, var(--brand)); box-shadow: inset 0 0 0 1px var(--tpc, var(--brand)); background: color-mix(in srgb, var(--tpc, var(--brand)) 8%, var(--surface)); }

/* Agenda con bloques de color vivos (referencia AgendaPro) */
.ag-appt { background: color-mix(in srgb, var(--c, var(--brand)) 26%, var(--surface)); border-radius: 8px; padding: 5px 8px; }
.ag-appt.st-confirmed, .ag-appt.st-checked_in, .ag-appt.st-in_progress { background: color-mix(in srgb, var(--c, var(--brand)) 36%, var(--surface)); }

.ag-appt b { font-weight: 700; }
.ag-colhead { border-bottom: 3px solid var(--line); }

/* ---------- Reserva online rediseñada (CHG-051) ---------- */
.bk-hero { background: linear-gradient(120deg, var(--tc, var(--brand)) 0%, color-mix(in srgb, var(--tc, var(--brand)) 60%, var(--accent)) 100%); color: #fff; }
.bk-hero-in { max-width: 1120px; margin: 0 auto; padding: 22px 16px 54px; display: flex; gap: 16px; align-items: flex-start; }
.bk-hero h1 { color: #fff; font-size: clamp(1.3rem, 3vw, 1.8rem); }
.bk-hero p { margin: 4px 0 8px; color: rgba(255, 255, 255, .88); }
.bk-logo { width: 54px; height: 54px; border-radius: 14px; background: #fff !important; color: var(--tc, var(--brand)) !important; font-size: 1.2rem; box-shadow: 0 6px 18px rgba(0, 0, 0, .15); }
.bk-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: rgba(255, 255, 255, .92); }
.bk-meta span { display: inline-flex; gap: 6px; align-items: center; }
.bk-meta svg { width: 14px; height: 14px; }
.bk-login { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .3); color: #fff; }
.bk-login:hover { background: rgba(255, 255, 255, .26); }
.bk-body { max-width: 1120px; margin-top: -38px; position: relative; padding-top: 0; }
.bk-steps { display: flex; gap: 4px; background: var(--surface); border-radius: 14px; padding: 6px; box-shadow: var(--shadow); overflow-x: auto; }
.bk-st { all: unset; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; font-size: .84rem; font-weight: 600; color: var(--muted); white-space: nowrap; flex: 1; justify-content: center; }
.bk-st[disabled] { cursor: default; opacity: .7; }
.bk-st .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); font-size: .76rem; flex: none; }

.bk-st.done .n { background: var(--ok); color: #fff; }
.bk-prog { height: 4px; background: var(--surface-3); border-radius: 4px; margin: 10px 4px 16px; overflow: hidden; }
.bk-prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--accent)); border-radius: 4px; transition: width .3s; }
.bk-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.bk-main { padding: 20px 22px 22px; }
.bk-back { display: inline-flex; align-items: center; gap: 4px; margin-bottom: 6px; }
.bk-back svg { width: 15px; height: 15px; }
.bk-q { font-size: 1.25rem; margin-bottom: 14px; }
.bk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.bk-opt { all: unset; cursor: pointer; display: flex; gap: 12px; align-items: center; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); transition: border-color .15s, box-shadow .15s; }
.bk-opt:hover { border-color: var(--brand); box-shadow: 0 4px 14px color-mix(in srgb, var(--brand) 14%, transparent); }
.bk-opt.on { border-color: var(--brand); background: var(--brand-soft); }
.bk-opt[disabled] { opacity: .5; cursor: not-allowed; }
.bk-opt b { display: block; }
.bk-opt small { color: var(--muted); font-size: .8rem; }
.bk-opt > div { flex: 1; min-width: 0; }
.bk-oic { width: 40px; height: 40px; border-radius: 12px; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; flex: none; }
.bk-oic.acc { background: var(--accent-soft); color: var(--accent); }
.bk-oic svg { width: 20px; height: 20px; }
.bk-tools { display: flex; gap: 8px; }
.bk-search { flex: 1; display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--surface); }
.bk-search:focus-within { border-color: var(--brand); }
.bk-search svg { width: 17px; height: 17px; color: var(--muted); }
.bk-search input { all: unset; flex: 1; padding: 10px 0; font-size: .92rem; }
.chip .cdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--cc); margin-right: 6px; vertical-align: 0; }
.chip.on .cdot { background: #fff; }
.bk-svcs { display: grid; gap: 10px; }
.bk-svc { all: unset; cursor: pointer; display: flex; align-items: stretch; gap: 14px; padding: 12px 14px 12px 0; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; transition: border-color .15s, box-shadow .15s; }
.bk-svc:hover { border-color: var(--cc); box-shadow: 0 4px 14px color-mix(in srgb, var(--cc) 18%, transparent); }
.bk-svc.on { border-color: var(--brand); background: var(--brand-soft); }
.bk-svc-bar { width: 6px; background: var(--cc); flex: none; }
.bk-svc-main { flex: 1; min-width: 0; }
.bk-svc-main b { display: block; font-size: .98rem; }
.bk-svc-main small { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
.bk-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.bk-tags span { display: inline-flex; align-items: center; gap: 4px; font-size: .72rem; font-weight: 600; padding: 3px 8px; border-radius: 20px; background: var(--surface-2); color: var(--ink-2); }
.bk-tags span.acc { background: var(--accent-soft); color: var(--accent); }

.bk-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }

.bk-days button i { display: block; font-style: normal; font-size: .66rem; color: var(--ok); font-weight: 600; }

.bk-days button.none i { color: var(--muted); }
.bk-days button:hover:not(.none) { border-color: var(--brand); }

.bk-slots { margin-top: 16px; display: grid; gap: 14px; }

.bk-slots .slot { padding: 10px 4px; border-radius: 10px; font-size: .88rem; border-width: 1.5px; }
.bk-form .in { padding: 11px 12px; }
.bk-depbox { margin-top: 14px; padding: 14px; border-radius: 12px; background: var(--accent-soft); }
.bk-depbox svg { width: 18px; height: 18px; color: var(--accent); }
.bk-who { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.bk-who svg { width: 20px; height: 20px; color: var(--brand); }
.bk-who small { display: block; color: var(--muted); font-size: .74rem; }
.bk-policy { margin-top: 12px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line-2); font-size: .84rem; }
.bk-policy ul { margin: 6px 0 0; padding-left: 18px; }
.bk-pay { display: flex; gap: 8px; flex-wrap: wrap; }
.bk-pay label { cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px; font-weight: 600; font-size: .86rem; }
.bk-pay label.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.bk-pay input { position: absolute; opacity: 0; pointer-events: none; }
.bk-pay svg { width: 17px; height: 17px; }
.bk-sum { padding: 16px; position: sticky; top: 16px; }
.bk-sum-h { font: 750 1rem var(--f-display); margin-bottom: 10px; }
.bk-sum ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.bk-sum li { display: flex; gap: 10px; align-items: center; }
.bk-sum li > div { flex: 1; min-width: 0; }
.bk-sum li small { display: block; font-size: .72rem; color: var(--muted); }
.bk-sum li b { display: block; font-size: .86rem; font-weight: 650; }
.bk-sic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); flex: none; }
.bk-sic svg { width: 16px; height: 16px; }
.bk-sum li.ok .bk-sic { background: var(--brand-soft); color: var(--brand); }
.bk-total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
.bk-total b { font: 800 1.35rem var(--f-display); }
.bk-hold { margin-top: 10px; display: flex; gap: 6px; align-items: center; font-size: .78rem; padding: 8px 10px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); }

.bk-done-ic svg { width: 32px; height: 32px; }
.bk-ticket { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; text-align: left; margin: 16px 0 8px; padding: 14px; border-radius: 14px; background: var(--surface-2); border: 1px dashed var(--line-2); }
.bk-ticket small { display: block; font-size: .72rem; color: var(--muted); }

  .bk-sum { position: static; order: -1; padding: 12px 14px; }
  .bk-sum ul { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .bk-sum .bk-cta { display: none; }
  .bk-mfoot { display: block; position: sticky; bottom: 0; margin: 16px -22px -22px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 0 0 var(--r-lg) var(--r-lg); }
  .bk-st .l { display: none; }
  .bk-st.on .l { display: inline; }
  .bk-days { gap: 4px; }
  .bk-days button { padding: 8px 0; }
  .bk-days button i { display: none; }
  .bk-svc-price { justify-content: center; }
  .bk-hero-in { padding-bottom: 50px; }
  .bk-meta { display: none; }
}
@media (max-width: 860px) {
  .bk-sum ul { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .bk-sum li .linkbtn { display: none; }
  .bk-sum li { gap: 8px; }
  .bk-sum .bk-sic { width: 26px; height: 26px; }
  .bk-sum li small { display: none; }
  .bk-sum-h { margin-bottom: 6px; font-size: .9rem; }
  .bk-total { margin-top: 8px; padding-top: 8px; }
}

/* ---------- Agenda: vistas Semana (grilla) y Mes (CHG-054) ---------- */
.view-sw button { min-width: 64px; }
.wkhead { flex-direction: column; align-items: flex-start; gap: 0; }
.wkhead .linkbtn { display: flex; align-items: baseline; gap: 6px; color: var(--ink); }
.wkhead .linkbtn small { font-size: .72rem; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.wkhead .linkbtn b { font: 750 1.2rem var(--f-display); }
.wkhead.today { border-bottom-color: var(--brand) !important; }
.wkhead.today .linkbtn b { color: #fff; background: var(--brand); border-radius: 50%; width: 30px; height: 30px; display: inline-grid; place-items: center; font-size: 1rem; }
.ag-appt.wk { left: auto; right: auto; font-size: .7rem; padding: 3px 6px; }
.ag-appt.wk .s { font-size: .68rem; }
.ag-appt.group { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); border-left: 4px solid var(--accent); }
.mo-sum { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 12px 14px 4px; font-size: .84rem; color: var(--muted); }
.mo-sum b { color: var(--ink); font-size: .95rem; }
.mo-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 10px 12px 14px; }
.mo-dow { font-size: .72rem; font-weight: 700; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
.mo-cell { min-height: 112px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 6px 7px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; transition: border-color .15s, box-shadow .15s; }
.mo-cell:hover, .mo-cell:focus-visible { border-color: var(--brand); box-shadow: 0 4px 12px color-mix(in srgb, var(--brand) 14%, transparent); outline: none; }
.mo-cell.out { opacity: .45; }
.mo-cell.closed { background: var(--hatch), var(--surface); }
.mo-cell.today { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.mo-cell.today .mo-h b { background: var(--brand); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: inline-grid; place-items: center; }
.mo-h { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.mo-h b { font: 700 .9rem var(--f-display); }
.mo-n { font-size: .68rem; font-weight: 700; background: var(--brand-soft); color: var(--brand); padding: 0 7px; border-radius: 10px; }
.mo-tag { font-size: .62rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mo-occ { height: 4px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.mo-occ i { display: block; height: 100%; border-radius: 3px; }
.mo-ev { font-size: .68rem; padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, var(--c, var(--brand)) 26%, var(--surface)); border-left: 3px solid var(--c, var(--brand)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.mo-ev.st-pending { background: color-mix(in srgb, var(--c, var(--brand)) 12%, var(--surface)); border-left-style: dashed; }
.mo-ev.st-no_show { background: var(--bad-soft); border-left-color: var(--bad); }
.mo-ev.st-completed { opacity: .7; }
.mo-more { font-size: .68rem; color: var(--brand); font-weight: 700; }
@media (max-width: 720px) {
  .mo-grid { gap: 3px; padding: 8px; }
  .mo-cell { min-height: 64px; padding: 4px; border-radius: 8px; }
  .mo-ev, .mo-more, .mo-tag { display: none; }
}

/* ---------- CRM Kanban (CHG-055) ---------- */
.kb-wrap { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; align-items: start; }
.kb-col { background: var(--surface-2); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 240px; border: 1px solid var(--line); }
.kb-col.drop { outline: 2px dashed var(--brand); outline-offset: -4px; background: var(--brand-soft); }
.kb-h { display: flex; align-items: center; gap: 8px; padding: 2px 4px 6px; border-bottom: 3px solid var(--kc); }
.kb-h b { flex: 1; font-size: .88rem; }
.kb-h .n { font-size: .72rem; font-weight: 700; background: var(--kc); color: #fff; border-radius: 10px; padding: 0 8px; }
.kb-h small { display: block; font-size: .7rem; color: var(--muted); font-weight: 500; }
.kb-card { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--kc); border-radius: 12px; padding: 10px; cursor: grab; box-shadow: 0 1px 2px rgba(16, 24, 40, .05); }
.kb-card:hover { box-shadow: var(--shadow); }
.kb-card.dragging { opacity: .5; }
.kb-card .top { display: flex; gap: 8px; align-items: center; }
.kb-card .top b { font-size: .86rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kb-card .top small { color: var(--muted); font-size: .72rem; }
.kb-card .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .72rem; color: var(--ink-2); margin-top: 6px; }
.kb-card .meta span { display: inline-flex; gap: 4px; align-items: center; }
.kb-card .meta svg { width: 12px; height: 12px; color: var(--muted); }
.kb-card .acts { display: flex; gap: 4px; margin-top: 8px; align-items: center; }
.kb-card .acts select { font-size: .72rem; padding: 3px 6px; height: auto; flex: 1; min-width: 0; }
.kb-pin { color: var(--accent); }
.kb-pin svg { width: 12px; height: 12px; }
.kb-empty { font-size: .78rem; color: var(--muted); text-align: center; padding: 18px 6px; border: 1px dashed var(--line-2); border-radius: 10px; }
.ag-appt.wk.narrow { padding: 3px 4px; }
.ag-appt.wk.narrow b { font-size: .66rem; }
@media (max-width: 720px) { .mo-h { flex-direction: column; align-items: flex-start; gap: 2px; } .mo-n { font-size: .6rem; padding: 0 5px; } .kb-wrap { grid-auto-columns: minmax(250px, 86vw); } }

/* ===== v1.4 · UX (CHG-056 a CHG-060) ===== */
html:not(.dev-on) .ref, html:not(.dev-on) .toast .code { display: none !important; }
.field.invalid .in, .field.invalid select, .field.invalid textarea { border-color: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 16%, transparent); }
.field .err { display: block; margin-top: 4px; font-size: .76rem; color: var(--bad); font-weight: 600; }
.drawer-f { align-items: center; }
.drawer-f .grow { flex: 1; }
.drawer-f .btn.primary, .drawer-f .btn.accent { padding-inline: 18px; font-weight: 700; }
details.more { position: relative; }
details.more > summary { list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > .menu.up { bottom: calc(100% + 8px); right: 0; min-width: 230px; }
.menu button.danger { color: var(--bad); }
.menu button.danger svg { color: var(--bad); }
.menu button.locked { opacity: .5; cursor: not-allowed; }
.onb { margin-bottom: 16px; padding: 16px 18px; border-left: 4px solid var(--brand); }
.onb-h { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.onb-h h3 { margin: 0; } .onb-h p { margin: 2px 0 0; }
.onb-bar { flex: 1; min-width: 120px; height: 8px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.onb-bar i { display: block; height: 100%; background: var(--brand); border-radius: 8px; }
.onb-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.onb-list li { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.onb-list li div { flex: 1; min-width: 0; } .onb-list li b { display: block; font-size: .86rem; } .onb-list li span { font-size: .76rem; color: var(--muted); }
.onb-list li.next { border-color: var(--brand); background: var(--brand-soft); }
.onb-list li.done b { color: var(--muted); text-decoration: line-through; }
.onb-ck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.onb-list li.done .onb-ck { background: var(--ok); border-color: var(--ok); color: #fff; }
.onb-ck svg { width: 13px; height: 13px; }
.bnav { display: none; }
@media (max-width: 900px) {
  .bnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; align-items: center; box-shadow: 0 -4px 16px rgba(16, 24, 40, .06); }
  .bnav a, .bnav button { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 2px; min-width: 56px; min-height: 44px; align-content: center; font-size: .68rem; font-weight: 600; color: var(--muted); border-radius: 10px; }
  .bnav svg { width: 21px; height: 21px; }
  .bnav a.on { color: var(--brand); }
  .bnav .bnav-new { width: 48px; height: 48px; min-width: 48px; border-radius: 50%; background: var(--brand); color: #fff; margin-top: -18px; box-shadow: var(--shadow-lg); place-items: center; }
  .bnav .bnav-new svg { width: 24px; height: 24px; }
  .content { padding-bottom: 84px; }
  .toasts { bottom: 78px; }
  .drawer-f { position: sticky; bottom: 0; background: var(--surface); }
  .drawer-f .btn.primary, .drawer-f .btn.accent { flex: 1; justify-content: center; }
}
button, .btn, .nav-item, .in { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
html:not(.dev-on) .origin, html:not(.dev-on) .devonly { display: none !important; }
@media (max-width: 900px) { .topbar .quick-new { display: none; } }
